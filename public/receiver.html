      }
    }

    function findStationIndex(stationId, stationName, streamUrl) {
      if (!receiverStations || receiverStations.length === 0) return 0;
      const cleanId = (stationId || '').toLowerCase().trim();
      const cleanName = (stationName || '').toLowerCase().trim().replace(/^radio synapse\s*-\s*/i, '');
      const cleanUrl = (streamUrl || '').toLowerCase().trim();

      const idx = receiverStations.findIndex(s => {
        const sId = (s.id || '').toLowerCase();
        const sName = (s.name || '').toLowerCase();
        const sShutter = (s.shutterLabel || '').toLowerCase();
        const sUrl = (s.streamUrl || '').toLowerCase();

        if (cleanId && (sId === cleanId || (s.shortcodes && s.shortcodes.includes(cleanId)) || sName === cleanId || sShutter === cleanId)) return true;
        if (cleanName && (sName === cleanName || sShutter === cleanName)) return true;
        if (cleanUrl && sUrl && (sUrl === cleanUrl || sUrl.includes(cleanUrl) || cleanUrl.includes(sUrl))) return true;
        if (cleanId && (sId.includes(cleanId) || cleanId.includes(sId))) return true;
        return false;
      });

      return idx >= 0 ? idx : 0;
    }

    /* Poll Live Now Playing API for real-time track metadata */
    async function pollNowPlaying() {
      // If a connected sender is actively managing playback and pushing real-time metadata, avoid background poll conflicts
      if (connectedSenderId) return;

      const stConfig = receiverStations[currentStationIdx] || receiverStations[0];
      const origin = 'https://cast.radiosynapse.fr';
      const cacheBust = Date.now();

      // Station candidate endpoints in order of precision
      const candidateUrls = [];
      if (stConfig.id) {
        candidateUrls.push(`${origin}/api/nowplaying/${encodeURIComponent(stConfig.id)}?_t=${cacheBust}`);
      }
      if (stConfig.shortcodes && stConfig.shortcodes.length > 0) {
        candidateUrls.push(`${origin}/api/nowplaying/${encodeURIComponent(stConfig.shortcodes[0])}?_t=${cacheBust}`);
      }
      candidateUrls.push(`${origin}/api/nowplaying/pop-variete?_t=${cacheBust}`);
      candidateUrls.push(`${origin}/api/nowplaying/1?_t=${cacheBust}`);
      candidateUrls.push(`${origin}/api/nowplaying?_t=${cacheBust}`);

      for (const ep of candidateUrls) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2000);
          const res = await fetch(ep, { signal: controller.signal, cache: 'no-store' });
          clearTimeout(timeoutId);
          if (!res.ok) continue;

          const data = await res.json();
          let matchedStation = null;

          if (Array.isArray(data)) {
            matchedStation = data.find((item) => {
              const sc = (item?.station?.shortcode || '').toLowerCase();
              const name = (item?.station?.name || '').toLowerCase();
              const stId = (stConfig.id || '').toLowerCase();
              const stName = (stConfig.name || '').toLowerCase();
              const stListenUrl = (item?.station?.listen_url || '').toLowerCase();
              const confUrl = (stConfig.streamUrl || '').toLowerCase();
              return (stConfig.shortcodes && stConfig.shortcodes.includes(sc)) || 
                     sc === stId || 
                     sc.includes(stId) ||
                     stId.includes(sc) ||
                     (name && (name.includes(stName) || stName.includes(name))) ||
                     (confUrl && stListenUrl && (confUrl.includes(sc) || stListenUrl === confUrl || confUrl.includes(stListenUrl) || stListenUrl.includes(confUrl)));
            }) || (data.length === 1 ? data[0] : null);
          } else if (data && data.now_playing) {
            matchedStation = data;
          }

          if (matchedStation && matchedStation.now_playing) {
            const np = matchedStation.now_playing;
            const rawTitle = np.song?.title || '';
            const rawArtist = np.song?.artist || '';
            const rawText = np.song?.text || '';
            const rawArt = np.song?.art || '';
            const songDuration = Math.round(np.duration || 240);
            const playedAt = np.played_at || 0;
            const elapsed = np.elapsed || 0;
            const nowSec = Math.floor(Date.now() / 1000);

            currentDuration = songDuration > 0 ? songDuration : 240;
            trackFetchTime = nowSec;

            // Prioritize absolute elapsed counter to eliminate client-server clock drift
            if (typeof elapsed === 'number' && elapsed >= 0) {
              trackElapsed = elapsed;
              currentElapsed = Math.max(0, Math.min(currentDuration, Math.round(elapsed)));
              trackPlayedAt = playedAt || (nowSec - currentElapsed);
            } else if (playedAt && playedAt > 0) {
              trackPlayedAt = playedAt;
              currentElapsed = Math.max(0, Math.min(currentDuration, nowSec - playedAt));
              trackElapsed = currentElapsed;
            }
            updateClockAndTimeline(true);

            const parsed = parseMetadata(rawTitle, rawArtist, rawText);
            const trackKey = (parsed.cleanArtist + ' - ' + parsed.cleanTitle + ' - ' + currentStationIdx).toLowerCase();

            if (trackKey !== lastTrackKey) {
              lastTrackKey = trackKey;

              // 1. Immediately update title & artist text with stream cover or fallback
              const immediateCover = rawArt || null;
              updateDisplay(parsed.cleanTitle, parsed.cleanArtist, immediateCover, stConfig.shutterLabel);

              // 2. If no direct album art was provided, resolve high-res cover asynchronously
              if (!rawArt) {
                fetchArtwork(parsed.cleanTitle, parsed.cleanArtist, stConfig.fallbackCoverUrl).then((resolvedCover) => {
                  if (resolvedCover) {
                    updateDisplay(parsed.cleanTitle, parsed.cleanArtist, resolvedCover, stConfig.shutterLabel);
                  }
                });
              }
            }
            // Successfully retrieved active metadata
            break;
          }
        } catch (err) {
          // Continue to next endpoint candidate
        }
      }
    }

    // Format seconds into MM:SS
    function formatTime(seconds) {
      const s = Math.floor(Math.max(0, seconds || 0));
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Direct Native Audio Launcher
    function playAudioOnTV(url) {
      if (!tvAudio) return;

      initAudioAnalyser();
      resumeAudioCtx();

      let resolvedUrl = url;
      if (!resolvedUrl && receiverStations[currentStationIdx]) {
        resolvedUrl = receiverStations[currentStationIdx].streamUrl;
      }
      if (!resolvedUrl) return;

      resolvedUrl = getOptimizedHighQualityAudioUrl(resolvedUrl);

      // Replace existing stream cleanly to ensure single stream playback without superposition
      if (tvAudio.src !== resolvedUrl) {
        try {
          tvAudio.pause();
        } catch (e) {}
        tvAudio.src = resolvedUrl;
        tvAudio.load();
      }
      
      setPlaybackUIState(true);

      const playPromise = tvAudio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          console.log('[TV Receiver] Playing high-quality audio stream:', resolvedUrl);
          resumeAudioCtx();
          onAudioPlayingConfirmed();
        }).catch(err => {
          console.warn('[TV Receiver] Autoplay catch:', err);
        });
      }
    }

    function setPlaybackUIState(playing) {
      isPlayingUI = playing;
      if (playing) {
        cdPlatter.classList.add('spin-animation');
        metalShutter.classList.add('shutter-open-transform');
        shutterLed.classList.add('shutter-led-active');
        playBtnIconContainer.innerHTML = '<svg viewBox="0 0 24 24" style="fill: currentColor;"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';
      } else {
        cdPlatter.classList.remove('spin-animation');
        metalShutter.classList.remove('shutter-open-transform');
        shutterLed.classList.remove('shutter-led-active');
        playBtnIconContainer.innerHTML = '<svg viewBox="0 0 24 24" style="fill: currentColor; margin-left: 2px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
      }
    }

    function togglePlayPause() {
      resumeAudioCtx();
      if (tvAudio.paused) {
        if (!tvAudio.src) {
          const st = receiverStations[currentStationIdx] || receiverStations[0];
          playAudioOnTV(st.streamUrl);
        } else {
          tvAudio.play().then(() => {
            setPlaybackUIState(true);
            dismissSplashScreen();
          }).catch(() => {});
        }
      } else {
        tvAudio.pause();
        setPlaybackUIState(false);
      }
    }

    function switchStation(idx) {
      if (!receiverStations || receiverStations.length === 0) return;
      currentStationIdx = (idx + receiverStations.length) % receiverStations.length;
      const st = receiverStations[currentStationIdx];
      lastTrackKey = ''; // Force refresh metadata for new station

      // Tactile shutter animation on station switch with smooth transition
      if (metalShutter) {
        metalShutter.classList.remove('shutter-open-transform');
        setTimeout(() => {
          if (isPlayingUI || (tvAudio && !tvAudio.paused)) {
            metalShutter.classList.add('shutter-open-transform');
          }
        }, 280);
      }

      // Reset track info to 'En direct' while polling
      updateDisplay('En direct', 'Radio Synapse', st.fallbackCoverUrl, st.shutterLabel);
      playAudioOnTV(st.streamUrl);

      // Broadcast station change to sender (phone / web app)
      broadcastStationChanged(st);

      // Fetch new station's metadata immediately
      pollNowPlaying();
    }

    function broadcastStationChanged(st) {
      if (!castReceiverCtx) return;
      const payload = {
        type: 'STATION_CHANGED',
        stationId: st.id,
        stationName: st.shutterLabel || st.name,
        stationIdx: currentStationIdx,
        streamUrl: st.streamUrl
      };
      try {
        castReceiverCtx.sendCustomMessage(CUSTOM_CHANNEL, undefined, payload);
        console.log('[TV Receiver] Broadcasted STATION_CHANGED to all senders:', st.id);
      } catch (err) {
        console.warn('[TV Receiver] sendCustomMessage error:', err);
      }
      if (connectedSenderId) {
        try {
          castReceiverCtx.sendCustomMessage(CUSTOM_CHANNEL, connectedSenderId, payload);
          console.log('[TV Receiver] Direct sent STATION_CHANGED to connected sender:', connectedSenderId);
        } catch (err) {}
      }
      try {
        const senders = castReceiverCtx.getSenders ? castReceiverCtx.getSenders() : [];
        if (Array.isArray(senders)) {
          senders.forEach((s) => {
            if (s && s.id && s.id !== connectedSenderId) {
              try {
                castReceiverCtx.sendCustomMessage(CUSTOM_CHANNEL, s.id, payload);
              } catch (e) {}
            }
          });
        }
      } catch (e) {}
    }

    function adjustVolume(delta) {
      let v = Math.min(1, Math.max(0, tvAudio.volume + delta));
      tvAudio.volume = v;
      tvAudio.muted = false;
    }

    // Button Click Listeners
    btnPlayPause.addEventListener('click', togglePlayPause);
    btnPrevStation.addEventListener('click', () => switchStation(currentStationIdx - 1));
    btnNextStation.addEventListener('click', () => switchStation(currentStationIdx + 1));

    // TV Remote D-Pad Navigation & Keyboard Interactivity
    function updateTvFocus() {
      controlButtons.forEach((btn, index) => {
        if (index === activeFocusedIdx) {
          btn.classList.add('tv-focused');
          btn.focus();
        } else {
          btn.classList.remove('tv-focused');
        }
      });
    }

    updateTvFocus();

    document.addEventListener('keydown', (e) => {
      resumeAudioCtx();
      if (tvAudio.paused && isPlayingUI) {
        tvAudio.play().catch(() => {});
      }

      const key = e.key;
      const code = e.keyCode || e.which;

      // 1. D-Pad Arrows (Up, Down, Left, Right): Navigates strictly between clickable UI buttons on the deck!
      if (key === 'ArrowRight' || key === 'ArrowDown') {
        activeFocusedIdx = (activeFocusedIdx + 1) % controlButtons.length;
        updateTvFocus();
        e.preventDefault();
      } else if (key === 'ArrowLeft' || key === 'ArrowUp') {
        activeFocusedIdx = (activeFocusedIdx - 1 + controlButtons.length) % controlButtons.length;
        updateTvFocus();
        e.preventDefault();
      } 
      // 2. Select / Enter / OK: Activates the currently focused UI button!
      else if (key === 'Enter' || key === ' ' || key === 'Select' || code === 13 || code === 32 || code === 29443) {
        if (controlButtons[activeFocusedIdx]) {
          controlButtons[activeFocusedIdx].click();
        }
        e.preventDefault();
      } 
      // 3. Program + / Program - (ChannelUp / ChannelDown / PageUp / PageDown): Navigates between radio stations!
      else if (key === 'ChannelUp' || key === 'PageUp' || key === 'MediaTrackNext' || code === 427 || code === 33) {
        switchStation(currentStationIdx + 1);
        e.preventDefault();
      } else if (key === 'ChannelDown' || key === 'PageDown' || key === 'MediaTrackPrevious' || code === 428 || code === 34) {
        switchStation(currentStationIdx - 1);
        e.preventDefault();
      } 
      // 4. Play / Pause media keys on TV remote
      else if (key === 'MediaPlayPause' || key === 'MediaPlay' || key === 'MediaPause') {
        togglePlayPause();
        e.preventDefault();
      } 
      // 5. Volume controls on TV remote
      else if (key === 'VolumeUp') {
        adjustVolume(0.1);
        e.preventDefault();
      } else if (key === 'VolumeDown') {
        adjustVolume(-0.1);
        e.preventDefault();
      }
    });

    // Clock and Timeline Progress Local Ticker
    function updateClockAndTimeline(forceImmediate = false) {
      const now = new Date();
      const hrs = now.getHours().toString().padStart(2, '0');
      const mins = now.getMinutes().toString().padStart(2, '0');
      const secs = now.getSeconds().toString().padStart(2, '0');
      if (clockEl) clockEl.textContent = `${hrs}:${mins}:${secs}`;

      if (!forceImmediate) {
        const nowSec = Math.floor(Date.now() / 1000);
        if (typeof trackElapsed === 'number' && trackFetchTime > 0) {
          const delta = nowSec - trackFetchTime;
          currentElapsed = Math.min(currentDuration, Math.max(0, trackElapsed + delta));
        } else if (trackPlayedAt && trackPlayedAt > 0) {
          const realElapsed = nowSec - trackPlayedAt;
          if (realElapsed >= 0) {
            currentElapsed = Math.min(currentDuration, realElapsed);
          }
        } else if (isPlayingUI) {
          currentElapsed += 1;
          if (currentElapsed > currentDuration) {
            currentElapsed = currentDuration;
          }
        }
      }

      // If the current track has reached its end on-air, poll stream API immediately to transition track info with zero lag!
      if (isPlayingUI && currentElapsed >= currentDuration && currentDuration > 0) {
        if (!pollFastDebounceTimer) {
          pollFastDebounceTimer = setTimeout(() => {
            pollFastDebounceTimer = null;
            pollNowPlaying();
          }, 800);
        }
      }

      const pct = currentDuration > 0 ? (currentElapsed / currentDuration) * 100 : 0;
      if (timelineFill) timelineFill.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      if (timeElapsed) timeElapsed.textContent = formatTime(currentElapsed);
      if (timeDuration) timeDuration.textContent = formatTime(currentDuration);
    }

    setInterval(updateClockAndTimeline, 1000);
    setInterval(pollNowPlaying, 2500);

    // Initial boot sequence: start active official station immediately
    pollNowPlaying();
    setTimeout(() => {
      if (!tvAudio.src && receiverStations[currentStationIdx]) {
        playAudioOnTV(receiverStations[currentStationIdx].streamUrl);
      }
    }, 400);

    // Synchronize native audio events with UI state and handle stream persistence
    if (tvAudio) {
      tvAudio.addEventListener('play', () => {
        setPlaybackUIState(true);
      });
      tvAudio.addEventListener('playing', () => {
        setPlaybackUIState(true);
        onAudioPlayingConfirmed();
      });
      tvAudio.addEventListener('timeupdate', () => {
        if (tvAudio.currentTime > 0.1) {
          onAudioPlayingConfirmed();
        }
      });
      tvAudio.addEventListener('pause', () => setPlaybackUIState(false));
      tvAudio.addEventListener('ended', () => {
        // Stream should never cut off; auto-reconnect if it ends unexpectedly
        if (isPlayingUI && tvAudio.src) {
          console.warn('[TV Audio Ended] Auto-reconnecting live stream...');
          setTimeout(() => {
            if (isPlayingUI) {
              tvAudio.load();
              tvAudio.play().catch(() => {});
            }
          }, 800);
        }
      });
      tvAudio.addEventListener('error', (err) => {
        console.warn('[TV Audio Error] Reconnecting in 1.2s...', err);
        if (isPlayingUI && tvAudio.src) {
          setTimeout(() => {
            if (isPlayingUI) {
              tvAudio.load();
              tvAudio.play().catch(() => {});
            }
          }, 1200);
        }
      });
      tvAudio.addEventListener('stalled', () => {
        if (isPlayingUI && tvAudio.paused) {
          tvAudio.play().catch(() => {});
        }
      });
    }

    // Keepalive Watchdog: ensures continuous playback until manually stopped
    setInterval(() => {
      if (isPlayingUI && tvAudio) {
        if (tvAudio.paused) {
          console.log('[TV Watchdog] Resuming audio stream...');
          tvAudio.play().catch(() => {});
        }
      }
    }, 8000);

    /* Google Cast CAF Receiver Initialization */
    if (window.cast && cast.framework) {
      try {
        const context = cast.framework.CastReceiverContext.getInstance();
        castReceiverCtx = context;
        const options = new cast.framework.CastReceiverOptions();
        // Prevent Smart TV or Chromecast from disconnecting due to idle timeout
        options.disableIdleTimeout = true;
        options.maxInactivity = 86400; // 24 hours persistence
        options.customNamespaces = {};
        options.customNamespaces[CUSTOM_CHANNEL] = cast.framework.system.MessageType.JSON;

        const playerManager = context.getPlayerManager();

        context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, (event) => {
          if (event && event.senderId) {
            connectedSenderId = event.senderId;
            console.log('[Cast Receiver] Sender connected:', connectedSenderId);
            const st = receiverStations[currentStationIdx] || receiverStations[0];
            try {
              context.sendCustomMessage(CUSTOM_CHANNEL, connectedSenderId, {
                type: 'RECEIVER_STATUS',
                stationId: st.id,
                stationName: st.shutterLabel || st.name,
                stationIdx: currentStationIdx,
                streamUrl: st.streamUrl,
                isPlaying: isPlayingUI
              });
            } catch (e) {}
          }
        });

        context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, (event) => {
          if (event && event.senderId === connectedSenderId) {
            connectedSenderId = null;
          }
        });

        // CRITICAL: Intercept native Cast LOAD requests so CAF framework DOES NOT spawn a duplicate media player!
        // This eliminates double audio stream superposition completely.
        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.LOAD,
          (loadRequestData) => {
            console.log('[Cast Receiver] Intercepted native LOAD request:', loadRequestData);
            if (loadRequestData && loadRequestData.media) {
              const rawUrl = loadRequestData.media.contentUrl || loadRequestData.media.contentId || '';
              const url = getOptimizedHighQualityAudioUrl(rawUrl);
              const metadata = loadRequestData.media.metadata || {};
              const customData = loadRequestData.media.customData || {};
              const rawStation = (metadata.albumName || url || '').toLowerCase();

              currentStationIdx = findStationIndex(rawStation, metadata.albumName, url);
              const st = receiverStations[currentStationIdx] || receiverStations[0];

              const title = metadata.title || metadata.songName || 'En direct';
              const artist = metadata.artist || 'Radio Synapse';
              const coverUrl = (metadata.images && metadata.images[0]) ? (metadata.images[0].url || metadata.images[0]) : '';

              if (customData.duration && customData.duration > 0) {
                currentDuration = customData.duration;
              }
              const nowSec = Math.floor(Date.now() / 1000);
              if (typeof customData.currentTime === 'number' && customData.currentTime >= 0) {
                currentElapsed = Math.min(currentDuration, Math.round(customData.currentTime));
                trackElapsed = currentElapsed;
                trackFetchTime = nowSec;
                trackPlayedAt = customData.playedAt || (nowSec - currentElapsed);
              } else if (typeof customData.elapsed === 'number' && customData.elapsed >= 0) {
                trackElapsed = Math.round(customData.elapsed);
                trackFetchTime = nowSec;
                currentElapsed = Math.min(currentDuration, trackElapsed);
                trackPlayedAt = customData.playedAt || (nowSec - currentElapsed);
              } else if (customData.playedAt && customData.playedAt > 0) {
                trackPlayedAt = customData.playedAt;
                currentElapsed = Math.max(0, Math.min(currentDuration, nowSec - customData.playedAt));
                trackElapsed = currentElapsed;
                trackFetchTime = nowSec;
              }
              updateClockAndTimeline(true);

              updateDisplay(title, artist, coverUrl, st.shutterLabel);
              playAudioOnTV(url || st.streamUrl);
              pollNowPlaying();
            }
            // Return null so CAF cancels native framework player spawning and lets tvAudio handle 100% of playback
            return null;
          }
        );

        context.addCustomMessageListener(CUSTOM_CHANNEL, (event) => {
          if (event && event.senderId) {
            connectedSenderId = event.senderId;
          }
          if (event && event.data) {
            const data = event.data;
            if (data.stations && Array.isArray(data.stations)) {
              updateReceiverStations(data.stations);
            }

            if (data.type === 'SYNC_STATIONS' && data.stations) {
              updateReceiverStations(data.stations);
            } else if (
              data.type === 'PLAY_STATION' ||
              data.type === 'UPDATE_METADATA' ||
              data.type === 'LOAD_STREAM' ||
              data.type === 'METADATA_UPDATE'
            ) {
              if (data.stationId || data.stationName || data.streamUrl) {
                currentStationIdx = findStationIndex(data.stationId, data.stationName, data.streamUrl);
              }
              const st = receiverStations[currentStationIdx] || receiverStations[0];

              if (data.duration && data.duration > 0) {
                currentDuration = data.duration;
              }
              const nowSec = Math.floor(Date.now() / 1000);
              if (typeof data.currentTime === 'number' && data.currentTime >= 0) {
                currentElapsed = Math.min(currentDuration, Math.round(data.currentTime));
                trackElapsed = currentElapsed;
                trackFetchTime = nowSec;
                trackPlayedAt = data.playedAt || (nowSec - currentElapsed);
              } else if (typeof data.elapsed === 'number' && data.elapsed >= 0) {
                trackElapsed = Math.round(data.elapsed);
                trackFetchTime = nowSec;
                currentElapsed = Math.min(currentDuration, trackElapsed);
                trackPlayedAt = data.playedAt || (nowSec - currentElapsed);
              } else if (data.playedAt && data.playedAt > 0) {
                trackPlayedAt = data.playedAt;
                currentElapsed = Math.max(0, Math.min(currentDuration, nowSec - data.playedAt));
                trackElapsed = currentElapsed;
                trackFetchTime = nowSec;
              }
              updateClockAndTimeline(true);

              const receivedKey = ((data.artist || '') + ' - ' + (data.title || '') + ' - ' + currentStationIdx).toLowerCase();
              lastTrackKey = receivedKey;

              if (data.type === 'PLAY_STATION' || data.type === 'LOAD_STREAM' || (data.streamUrl && tvAudio.src !== data.streamUrl)) {
                playAudioOnTV(st.streamUrl || data.streamUrl);
              }
              if (data.title || data.artist) {
                updateDisplay(data.title || 'En direct', data.artist || 'Radio Synapse', data.coverUrl, st.shutterLabel, data.primaryColor, data.secondaryColor);
                if (!data.coverUrl && data.title && data.title !== 'En direct') {
                  fetchArtwork(data.title, data.artist || '', st.fallbackCoverUrl).then((resolvedCover) => {
                    if (resolvedCover) {
                      updateDisplay(data.title, data.artist || 'Radio Synapse', resolvedCover, st.shutterLabel, data.primaryColor, data.secondaryColor);
                    }
                  });
                }
              }
              if (data.primaryColor && data.secondaryColor) {
                transitionToHarmony(data.primaryColor, data.secondaryColor);
              }
            } else if (data.type === 'TIME_SYNC') {
              if (data.duration && data.duration > 0) {
                currentDuration = data.duration;
              }
              if (typeof data.currentTime === 'number' && data.currentTime >= 0) {
                const nowSec = Math.floor(Date.now() / 1000);
                currentElapsed = Math.min(currentDuration, Math.round(data.currentTime));
                trackElapsed = currentElapsed;
                trackFetchTime = nowSec;
                updateClockAndTimeline(true);
              }
            } else if (data.type === 'HARMONY_UPDATE') {
              if (data.primaryColor && data.secondaryColor) {
                transitionToHarmony(data.primaryColor, data.secondaryColor);
              }
            } else if (data.type === 'PLAY') {
              if (tvAudio.paused) {
                const st = receiverStations[currentStationIdx] || receiverStations[0];
                if (!tvAudio.src) playAudioOnTV(st.streamUrl);
                else {
                  tvAudio.play().then(() => {
                    setPlaybackUIState(true);
                  }).catch(() => {});
                }
              }
              setPlaybackUIState(true);
            } else if (data.type === 'PAUSE') {
              tvAudio.pause();
              setPlaybackUIState(false);
            } else if (data.type === 'PLAY_STATE') {
              const shouldPlay = !!data.isPlaying;
              if (shouldPlay) {
                if (tvAudio.paused) {
                  const st = receiverStations[currentStationIdx] || receiverStations[0];
                  if (!tvAudio.src) playAudioOnTV(st.streamUrl);
                  else {
                    tvAudio.play().then(() => {
                      setPlaybackUIState(true);
                    }).catch(() => {});
                  }
                }
                setPlaybackUIState(true);
              } else {
                tvAudio.pause();
                setPlaybackUIState(false);
              }
            }
          }
        });

        // Listen to Google Cast PlayerManager state changes
        try {
          playerManager.addEventListener(cast.framework.events.EventType.PLAYER_STATE_CHANGED, (event) => {
            if (event && event.playerState === cast.framework.messages.PlayerState.PLAYING) {
              setPlaybackUIState(true);
            } else if (event && (event.playerState === cast.framework.messages.PlayerState.PAUSED || event.playerState === cast.framework.messages.PlayerState.IDLE)) {
              setPlaybackUIState(false);
            }
          });
        } catch (e) {}

        context.start(options);
      } catch (e) {
        console.warn('[Cast Receiver] Cast framework init notice:', e);
      }
    }
  </script>
